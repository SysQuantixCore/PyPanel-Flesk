<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>File Manager</title>


    <style>

        #filemanager-module {
            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;

            background: #fff;

            color: #111;

            font-family:
                "Segoe UI",
                Tahoma,
                Arial,
                sans-serif;
        }


        #filemanager-module * {
            box-sizing: border-box;
        }


        .fm-toolbar {
            min-height: 38px;

            display: flex;
            align-items: center;

            gap: 5px;

            padding: 5px 8px;

            background: #f5f5f5;

            border-bottom: 1px solid #c8c8c8;
        }


        .fm-button {
            height: 28px;

            padding: 0 12px;

            border: 1px solid #b8b8b8;

            background: #fff;

            color: #111;

            cursor: pointer;

            font-family:
                "Segoe UI",
                Tahoma,
                Arial,
                sans-serif;
        }


        .fm-button:hover {
            background: #e8f1fb;

            border-color: #0078d7;
        }


        .fm-button.primary {
            background: #0078d7;

            border-color: #006cc1;

            color: #fff;
        }


        .fm-button.primary:hover {
            background: #006cc1;
        }


        .fm-header {
            min-height: 46px;

            display: flex;
            align-items: center;

            padding: 0 12px;

            background: #f7f7f7;

            border-bottom: 1px solid #ccc;
        }


        .fm-header-icon {
            margin-right: 9px;

            font-size: 20px;
        }


        .fm-header-title {
            font-size: 15px;

            font-weight: 600;
        }


        .fm-header-path {
            margin-left: 12px;

            color: #777;

            font-family:
                Consolas,
                "Courier New",
                monospace;

            font-size: 12px;
        }


        .fm-content {
            flex: 1;
            min-height: 0;

            display: flex;
            flex-direction: column;

            padding: 12px;

            overflow: hidden;
        }


        .fm-path {
            min-height: 32px;

            display: flex;
            align-items: center;

            padding: 5px 8px;

            margin-bottom: 8px;

            background: #fff;

            border: 1px solid #ccc;

            color: #333;

            font-family:
                Consolas,
                "Courier New",
                monospace;

            cursor: pointer;
        }


        .fm-path:hover {
            border-color: #0078d7;

            background: #f8fbff;
        }


        .fm-path-input {
            width: 100%;

            height: 25px;

            padding: 3px 6px;

            border: 1px solid #0078d7;

            outline: none;

            font-family:
                Consolas,
                "Courier New",
                monospace;
        }


        .fm-list {
            flex: 1;
            min-height: 0;

            overflow-y: auto;

            background: #fff;

            border: 1px solid #ccc;
        }


        .fm-list-header {
            height: 32px;

            display: grid;

            grid-template-columns:
                minmax(200px, 1fr)
                180px
                150px;

            align-items: center;

            padding: 0 10px;

            background: #eeeeee;

            border-bottom: 1px solid #ccc;

            font-weight: 600;
        }


        .fm-file-item {
            min-height: 48px;

            display: grid;

            grid-template-columns:
                minmax(200px, 1fr)
                180px
                150px;

            align-items: center;

            padding: 5px 10px;

            border-bottom: 1px solid #eeeeee;
        }


        .fm-file-item:hover {
            background: #f0f6fc;
        }


        .fm-file-name {
            display: flex;

            align-items: center;

            min-width: 0;
        }


        .fm-file-icon {
            width: 30px;

            flex-shrink: 0;

            text-align: center;

            font-size: 18px;
        }


        .fm-file-text {
            min-width: 0;
        }


        .fm-file-title {
            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

            color: #005cc5;

            cursor: pointer;
        }


        .fm-file-title:hover {
            text-decoration: underline;
        }


        .fm-file-date {
            color: #777;

            font-size: 11px;
        }


        .fm-file-actions {
            display: flex;

            justify-content: flex-end;

            gap: 5px;
        }


        .fm-action {
            height: 26px;

            padding: 0 9px;

            border: 1px solid #aaa;

            background: #fff;

            cursor: pointer;

            font-size: 12px;
        }


        .fm-action:hover {
            background: #e8f1fb;

            border-color: #0078d7;
        }


        .fm-action.delete:hover {
            background: #fde7e9;

            border-color: #e81123;

            color: #b00020;
        }


        .fm-empty {
            padding: 35px;

            text-align: center;

            color: #777;
        }


        .fm-grid-mode {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(170px, 1fr)
                );

            gap: 8px;

            padding: 8px;

            align-content: start;
        }


        .fm-grid-mode .fm-list-header {
            display: none;
        }


        .fm-grid-mode .fm-file-item {
            min-height: 145px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            padding: 12px;

            border: 1px solid #ddd;

            background: #fafafa;
        }


        .fm-grid-mode .fm-file-item:hover {
            background: #f0f6fc;

            border-color: #99cfff;
        }


        .fm-grid-mode .fm-file-name {
            flex-direction: column;

            justify-content: center;

            text-align: center;
        }


        .fm-grid-mode .fm-file-icon {
            width: auto;

            margin-bottom: 8px;

            font-size: 32px;
        }


        .fm-grid-mode .fm-file-title {
            max-width: 145px;
        }


        .fm-grid-mode .fm-file-date {
            margin-top: 4px;
        }


        .fm-grid-mode .fm-file-actions {
            margin-top: 12px;

            justify-content: center;
        }


        .fm-status {
            min-height: 25px;

            display: flex;
            align-items: center;

            padding: 0 8px;

            margin-top: 8px;

            background: #eeeeee;

            border: 1px solid #ccc;

            color: #666;

            font-size: 11px;
        }


        .fm-server-log {
            position: fixed;

            inset: 0;

            display: none;

            align-items: center;
            justify-content: center;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.35
                );

            z-index: 99999;
        }


        .fm-server-log.active {
            display: flex;
        }


        .fm-server-log-panel {
            width: 700px;

            max-width: 90%;

            height: 500px;

            max-height: 80%;

            display: flex;
            flex-direction: column;

            background: #f0f0f0;

            border: 1px solid #888;

            box-shadow:
                0 5px 20px
                rgba(
                    0,
                    0,
                    0,
                    0.3
                );
        }


        .fm-server-log-header {
            min-height: 34px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 8px;

            background: #0078d7;

            color: #fff;

            font-weight: bold;
        }


        .fm-server-log-close {
            padding: 4px 10px;

            border: 0;

            background: #e81123;

            color: #fff;

            cursor: pointer;
        }


        .fm-server-log-body {
            flex: 1;

            padding: 10px;

            overflow-y: auto;

            background: #fff;

            color: #000;

            font-family:
                Consolas,
                "Courier New",
                monospace;

            font-size: 12px;

            line-height: 1.5;
        }


        @media (max-width: 700px) {

            .fm-list-header {
                grid-template-columns:
                    minmax(150px, 1fr)
                    130px;
            }


            .fm-list-header div:nth-child(2) {
                display: none;
            }


            .fm-file-item {
                grid-template-columns:
                    minmax(150px, 1fr)
                    130px;
            }


            .fm-file-date {
                display: none;
            }

        }


        @media (max-width: 500px) {

            .fm-content {
                padding: 8px;
            }


            .fm-list-header {
                display: none;
            }


            .fm-file-item {
                display: flex;

                justify-content: space-between;

                gap: 8px;
            }


            .fm-file-actions {
                flex-shrink: 0;
            }


            .fm-action {
                padding: 0 6px;
            }


            .fm-header-path {
                display: none;
            }

        }

    </style>

</head>


<body>

<div id="filemanager-module">


    <div class="fm-header">

        <div class="fm-header-icon">
            📁
        </div>

        <div class="fm-header-title">
            File Manager
        </div>

        <div
            class="fm-header-path"
            id="fmHeaderPath">
            /htdocs
        </div>

    </div>


    <div class="fm-toolbar">

        <!-- Back Function -->
        <button
           class="fm-button"
           id="fmBackButton"
           onclick="FM.back()"
           style="display: none;"
           title="Voltar à pasta anterior">
           &lt; Back
        </button>

        <button
            class="fm-button primary"
            onclick="FM.upload()">
            ⬆ Upload
        </button>


        <button
            class="fm-button"
            onclick="FM.newFolder()">
            📁 New Folder
        </button>


        <button
            class="fm-button"
            onclick="FM.setView('list')">
            ☷ List
        </button>


        <button
            class="fm-button"
            onclick="FM.setView('grid')">
            ▦ Grid
        </button>


        <button
            class="fm-button"
            onclick="FM.refresh()">
            ↻ Refresh
        </button>


        <button
            class="fm-button"
            onclick="FM.toggleServerLog()">
            Server Log
        </button>

    </div>


    <div class="fm-content">


        <div
            class="fm-path"
            id="fmPath"
            onclick="FM.editPath()">
            /htdocs
        </div>


        <div
            class="fm-list"
            id="fmFileList">

            <div class="fm-empty">
                Loading...
            </div>

        </div>


        <div
            class="fm-status"
            id="fmStatus">
            Ready
        </div>

    </div>


</div>


<div
    class="fm-server-log"
    id="fmServerLog">

    <div class="fm-server-log-panel">

        <div class="fm-server-log-header">

            <span>
                Server Log
            </span>

            <button
                class="fm-server-log-close"
                onclick="FM.closeServerLog()">
                Close
            </button>

        </div>


        <div
            class="fm-server-log-body"
            id="fmServerLogBody">
        </div>

    </div>

</div>


<script>

(function () {

    const FM = {};

    let currentPath = "/htdocs";

    let files = [];

    let currentView = "list";


    function setStatus(message) {

        const status =
            document.getElementById(
                "fmStatus"
            );


        if (status) {

            status.textContent =
                message;

        }

    }


    function serverLog(message) {

        const body =
            document.getElementById(
                "fmServerLogBody"
            );


        const time =
            new Date().toLocaleTimeString();


        if (body) {

            body.insertAdjacentHTML(
                "beforeend",

                `[${time}] ${message}<br>`
            );


            body.scrollTop =
                body.scrollHeight;

        }


        if (
            typeof window.log ===
            "function"
        ) {

            window.log(
                "File Manager: " +
                message
            );

        }

    }


    async function fetchFiles() {

        setStatus(
            "Loading " +
            currentPath +
            "..."
        );


        try {

            const response =
                await fetch(
                    "/api/files?path=" +
                    encodeURIComponent(
                        currentPath
                    )
                );


            if (!response.ok) {

                throw new Error(
                    "HTTP " +
                    response.status
                );

            }


            files =
                await response.json();


            renderFiles();


            setStatus(
                files.length +
                " item(s)"
            );


            serverLog(
                "Directory opened: " +
                currentPath
            );


        } catch (error) {

            console.error(error);


            const list =
                document.getElementById(
                    "fmFileList"
                );


            if (list) {

                list.innerHTML = `

                    <div class="fm-empty">

                        Unable to access:
                        ${escapeHtml(
                            currentPath
                        )}

                    </div>

                `;

            }


            setStatus(
                "Error loading directory"
            );


            serverLog(
                "ERROR: " +
                error.message
            );

        }

    }


    function escapeHtml(value) {

        return String(value)
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    function renderFiles() {

        const list =
            document.getElementById(
                "fmFileList"
            );


        if (!list) {

            return;

        }


        list.classList.toggle(
            "fm-grid-mode",
            currentView === "grid"
        );


        list.innerHTML = `

            <div class="fm-list-header">

                <div>
                    Name
                </div>

                <div>
                    Date
                </div>

                <div>
                    Actions
                </div>

            </div>

        `;


        if (!files.length) {

            list.insertAdjacentHTML(
                "beforeend",

                `
                <div class="fm-empty">
                    This directory is empty.
                </div>
                `
            );

            return;

        }


        files.forEach(
            (file, index) => {

                const date =
                    file.date
                        ? new Date(
                            file.date * 1000
                        ).toLocaleString()
                        : "";


                const name =
                    escapeHtml(
                        file.name
                    );


                const isFolder =
                    !file.name.includes(".");


                const icon =
                    isFolder
                        ? "📁"
                        : "📄";


                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "fm-file-item";


                item.innerHTML = `

                    <div class="fm-file-name">

                        <div class="fm-file-icon">
                            ${icon}
                        </div>

                        <div class="fm-file-text">

                            <div
                                class="fm-file-title"
                                data-index="${index}">
                                ${name}
                            </div>

                            <div class="fm-file-date">
                                ${escapeHtml(date)}
                            </div>

                        </div>

                    </div>


                    <div class="fm-file-date">
                        ${escapeHtml(date)}
                    </div>


                    <div class="fm-file-actions">

                        <button
                            class="fm-action"
                            data-open="${index}">
                            Open
                        </button>

                        <button
                            class="fm-action delete"
                            data-delete="${index}">
                            Delete
                        </button>

                    </div>

                `;


                list.appendChild(
                    item
                );

            }
        );


        list
            .querySelectorAll(
                "[data-index]"
            )
            .forEach(element => {

                element.addEventListener(
                    "click",
                    () => {

                        const index =
                            Number(
                                element.dataset.index
                            );


                        openFile(
                            files[index].name
                        );

                    }
                );

            });


        list
            .querySelectorAll(
                "[data-open]"
            )
            .forEach(button => {

                button.addEventListener(
                    "click",
                    () => {

                        const index =
                            Number(
                                button.dataset.open
                            );


                        openFile(
                            files[index].name
                        );

                    }
                );

            });


        list
            .querySelectorAll(
                "[data-delete]"
            )
            .forEach(button => {

                button.addEventListener(
                    "click",
                    () => {

                        const index =
                            Number(
                                button.dataset.delete
                            );


                        deleteFile(
                            files[index].name
                        );

                    }
                );

            });

    }


    function openFile(name) {

        const fullPath =
            currentPath +
            "/" +
            name;


        if (!name.includes(".")) {

            changePath(
                fullPath
            );

            return;

        }


        const encodedPath =
            fullPath
                .split("/")
                .map(
                    part =>
                        encodeURIComponent(
                            part
                        )
                )
                .join("/");


        window.location.href =
            encodedPath;

    }


    function editPath() {

        const element =
            document.getElementById(
                "fmPath"
            );


        if (!element) {

            return;

        }


        const input =
            document.createElement(
                "input"
            );


        input.className =
            "fm-path-input";


        input.value =
            currentPath;


        element.innerHTML = "";


        element.appendChild(
            input
        );


        input.focus();

        input.select();


        input.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Enter"
                ) {

                    changePath(
                        input.value
                    );

                }

                if (
                    event.key ===
                    "Escape"
                ) {

                    updatePathDisplay();

                }

            }
        );


        input.addEventListener(
            "blur",
            () => {

                updatePathDisplay();

            }
        );

    }


    function updatePathDisplay() {

        const path =
            document.getElementById(
                "fmPath"
            );


        const headerPath =
            document.getElementById(
                "fmHeaderPath"
            );


        if (path) {

            path.textContent =
                currentPath;

        }


        if (headerPath) {

            headerPath.textContent =
                currentPath;

        }

        <!-- Back Function -->
        const backButton =
        document.getElementById("fmBackButton");

        if (backButton) {
        backButton.style.display =
        currentPath.replace(/\/+$/, "") === "/htdocs"
            ? "none"
            : "";
        }
        
    }


    function changePath(path) {

        path =
            String(path || "").trim();


        if (!path) {

            path =
                "/htdocs";

        }


        if (
            !path.startsWith("/")
        ) {

            path =
                "/" + path;

        }


        currentPath =
            path;


        updatePathDisplay();

        fetchFiles();

    }

    <!-- Back Function -->
    function back() {
    if (currentPath === "/htdocs") {
        return;
    }

    const parentPath = currentPath
        .replace(/\/+$/, "")
        .substring(
            0,
            currentPath.replace(/\/+$/, "").lastIndexOf("/")
        );

    changePath(
        parentPath.length >= 7
            ? parentPath
            : "/htdocs"
    );
    }



    async function deleteFile(name) {

        if (
            !confirm(
                "Deletar arquivo?"
            )
        ) {

            return;

        }


        try {

            let fullPath =
                currentPath;


            if (
                fullPath ===
                "/htdocs"
            ) {

                fullPath = "";

            } else {

                fullPath =
                    fullPath.replace(
                        /^\/htdocs\/?/,
                        ""
                    );

            }


            if (
                fullPath &&
                !fullPath.endsWith("/")
            ) {

                fullPath += "/";

            }


            fullPath += name;

            const response = await fetch(
            "/delete/" + encodeURIComponent(fullPath)
            );

            const responseText = await response.text();

            if (!response.ok) {
            throw new Error(
            "HTTP " + response.status + ": " + responseText
            );
            }

            serverLog("Deleted: " + fullPath);
            setStatus("Deleted successfully");
            await fetchFiles();

            } catch (error) {
            console.error("Delete error:", error);

            setStatus("Delete error: " + error.message);

            serverLog(
            "ERROR deleting " + name + ": " + error.message
            );
        }
    }


    function upload() {

        const input =
            document.createElement(
                "input"
            );


        input.type =
            "file";


        input.onchange =
            async function () {

                const file =
                    input.files[0];


                if (!file) {

                    return;

                }


                const formData =
                    new FormData();


                formData.append(
                    "file",
                    file
                );


                formData.append(
                    "path",
                    currentPath
                );


                try {

                    setStatus(
                        "Uploading " +
                        file.name +
                        "..."
                    );

                    const response = await fetch("/upload", {
                          method: "POST",
                          body: formData
                    });

                    const result = await response.json();

                    if (!response.ok || !result.success) {
                       throw new Error(
                          result.error || `HTTP ${response.status}`
                       );
                    }

                serverLog("Uploaded: " + result.filename);
                setStatus("Upload concluído: " + result.filename);

                await fetchFiles();

                } catch (error) {

                    console.error(
                        error
                    );


                    setStatus(
                        "Upload error"
                    );


                    serverLog(
                        "ERROR uploading: " +
                        file.name
                    );

                }

            };


        input.click();

    }


    async function newFolder() {

        const name =
            prompt(
                "Folder name:"
            );


        if (!name) {

            return;

        }


        try {

            const response =
                await fetch(
                    "/create_folder/" +
                    encodeURIComponent(
                        name
                    )
                );


            if (!response.ok) {

                throw new Error(
                    "HTTP " +
                    response.status
                );

            }


            serverLog(
                "Folder created: " +
                name
            );


            fetchFiles();


        } catch (error) {

            console.error(error);


            setStatus(
                "Folder creation error"
            );


            serverLog(
                "ERROR creating folder: " +
                name
            );

        }

    }


    function setView(mode) {

        if (
            mode !== "list" &&
            mode !== "grid"
        ) {

            return;

        }


        currentView =
            mode;


        renderFiles();


        serverLog(
            "View changed to: " +
            mode
        );

    }


    function refresh() {

        fetchFiles();

    }


    function toggleServerLog() {

        const box =
            document.getElementById(
                "fmServerLog"
            );


        if (box) {

            box.classList.add(
                "active"
            );

        }

    }


    function closeServerLog() {

        const box =
            document.getElementById(
                "fmServerLog"
            );


        if (box) {

            box.classList.remove(
                "active"
            );

        }

    }


    FM.upload =
        upload;

    FM.newFolder =
        newFolder;

    FM.setView =
        setView;

    FM.refresh =
        refresh;

    FM.editPath =
        editPath;

    <!-- Back Function -->
    FM.back =
    back;

    FM.toggleServerLog =
        toggleServerLog;

    FM.closeServerLog =
        closeServerLog;


    window.FM =
        FM;


    fetchFiles();

})();

</script>

</body>
</html>
