<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>PyPanel Flask</title>


    <style>

        /* =========================================================
           RESET
        ========================================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;

            overflow: hidden;

            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
            font-size: 13px;

            background: #f0f0f0;
            color: #111;
        }


        /* =========================================================
           WINDOW
        ========================================================= */

        .window {
            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;
        }


        /* =========================================================
           TITLE BAR
        ========================================================= */

        .titlebar {
            height: 32px;
            min-height: 32px;

            display: flex;
            align-items: center;

            background: #0078d7;
            color: #fff;

            user-select: none;
        }

        .title-icon {
            width: 32px;

            text-align: center;

            font-size: 15px;
        }

        .title {
            flex: 1;

            font-size: 13px;
        }

        .window-buttons {
            height: 100%;

            display: flex;
        }

        .window-button {
            width: 46px;
            height: 100%;

            border: 0;

            background: transparent;
            color: #fff;

            font-size: 15px;

            cursor: pointer;
        }

        .window-button:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .window-button.close:hover {
            background: #e81123;
        }


        /* =========================================================
           MAIN
        ========================================================= */

        .main {
            flex: 1;
            min-height: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;

            background: #f0f0f0;

            overflow-y: auto;
        }


        /* =========================================================
           LOGIN AREA
        ========================================================= */

        .login-container {
            width: 390px;
            max-width: 100%;
        }


        /* =========================================================
           HEADER
        ========================================================= */

        .login-header {
            height: 52px;
            min-height: 52px;

            display: flex;
            align-items: center;

            padding: 0 15px;

            background: #f7f7f7;

            border: 1px solid #ccc;
            border-bottom: 0;
        }

        .login-icon {
            margin-right: 10px;

            font-size: 21px;
        }

        .login-title {
            font-size: 16px;
            font-weight: 600;
        }

        .login-type {
            margin-left: 12px;

            color: #777;
        }


        /* =========================================================
           LOGIN PANEL
        ========================================================= */

        .login-panel {
            border: 1px solid #d0d0d0;

            background: #fff;
        }

        .panel-title {
            padding: 8px 11px;

            background: #eeeeee;

            border-bottom: 1px solid #d0d0d0;

            font-weight: 600;
        }

        .panel-body {
            padding: 18px;
        }


        /* =========================================================
           FORM
        ========================================================= */

        .form-group {
            margin-bottom: 14px;
        }

        .form-label {
            display: block;

            margin-bottom: 5px;

            color: #555;

            font-size: 12px;
        }

        input {
            width: 100%;
            height: 32px;

            padding: 5px 8px;

            border: 1px solid #aaa;

            background: #fff;

            color: #111;

            outline: none;

            font-family: inherit;
            font-size: 13px;
        }

        input:focus {
            border-color: #0078d7;

            box-shadow:
                0 0 0 1px #0078d7;
        }


        /* =========================================================
           BUTTON
        ========================================================= */

        .button-area {
            display: flex;
            justify-content: flex-end;

            margin-top: 18px;
        }

        .login-button {
            height: 30px;

            padding: 0 18px;

            border: 1px solid #aaa;

            background: #fff;

            color: #111;

            cursor: pointer;

            font-family: inherit;
            font-size: 13px;
        }

        .login-button:hover {
            background: #e8f1fb;

            border-color: #0078d7;
        }

        .login-button:active {
            background: #dcecf9;
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: default;
        }


        /* =========================================================
           SYSTEM LOG
        ========================================================= */

        .log-panel {
            margin-top: 12px;

            border: 1px solid #d0d0d0;

            background: #fff;
        }

        .log-header {
            height: 34px;
            min-height: 34px;

            display: flex;
            align-items: center;

            padding: 0 10px;

            background: #eeeeee;

            border-bottom: 1px solid #d0d0d0;

            font-weight: 600;
        }

        .log-body {
            min-height: 78px;

            padding: 10px;

            background: #fff;

            color: #000;

            font-family: Consolas, "Courier New", monospace;

            font-size: 12px;

            line-height: 1.6;
        }

        .log-line {
            padding: 2px 4px;

            border-bottom: 1px solid #f0f0f0;
        }


        /* =========================================================
           STATUS BAR
        ========================================================= */

        .statusbar {
            height: 24px;
            min-height: 24px;

            display: flex;
            align-items: center;

            padding: 0 8px;

            background: #eeeeee;

            border-top: 1px solid #c8c8c8;

            color: #555;
        }

        .status-right {
            margin-left: auto;
        }


        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (max-width: 500px) {

            .main {
                padding: 12px;
            }

            .login-container {
                width: 100%;
            }

            .login-type {
                display: none;
            }

        }

    </style>

</head>


<body>


<div class="window">


    <!-- =========================================================
         TITLE BAR
    ========================================================= -->

    <div class="titlebar">

        <div class="title-icon">
            🖥️
        </div>

        <div class="title">
            PyPanel Flask
        </div>

    </div>


    <!-- =========================================================
         MAIN
    ========================================================= -->

    <main class="main">


        <div class="login-container">


            <!-- =================================================
                 LOGIN HEADER
            ================================================= -->

            <div class="login-header">

                <div class="login-icon">
                    🔐
                </div>

                <div class="login-title">
                    Login
                </div>

                <div class="login-type">
                    PyPanel Flask
                </div>

            </div>


            <!-- =================================================
                 LOGIN
            ================================================= -->

            <div class="login-panel">

                <div class="panel-title">
                    Authentication
                </div>


                <div class="panel-body">


                    <form
                        method="POST"
                        id="login-form">


                        <div class="form-group">

                            <label
                                class="form-label"
                                for="username">
                                Usuário
                            </label>

                            <input
                                type="text"
                                id="username"
                                name="username"
                                autocomplete="username"
                                placeholder="Digite seu usuário"
                                required>

                        </div>


                        <div class="form-group">

                            <label
                                class="form-label"
                                for="password">
                                Senha
                            </label>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                autocomplete="current-password"
                                placeholder="Digite sua senha"
                                required>

                        </div>


                        <div class="button-area">

                            <button
                                class="login-button"
                                type="submit"
                                id="login-button">
                                Entrar
                            </button>

                        </div>


                    </form>

                </div>

            </div>


            <!-- =================================================
                 SYSTEM LOG
            ================================================= -->

            <div class="log-panel">

                <div class="log-header">
                    System Log
                </div>

                <div class="log-body">

                    <div
                        class="log-line"
                        id="server-status">
                        [CHECK] Verificando servidor...
                    </div>

                    <div
                        class="log-line"
                        id="connection-status">
                        [WAIT] Aguardando resposta...
                    </div>

                    <div
                        class="log-line"
                        id="login-status">
                        [WAIT] Aguardando login...
                    </div>

                </div>

            </div>


        </div>


    </main>


    <!-- =========================================================
         STATUS BAR
    ========================================================= -->

    <div class="statusbar">

        <span>
            Ready
        </span>

        <span class="status-right">
            PyPanel Flask 1.0
        </span>

    </div>


</div>


<script>


/* =========================================================
   LOGIN STATUS
========================================================= */

const loginForm =
    document.getElementById(
        "login-form"
    );


const loginButton =
    document.getElementById(
        "login-button"
    );


const loginStatus =
    document.getElementById(
        "login-status"
    );


loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        loginButton.disabled =
            true;


        loginButton.textContent =
            "Entrando...";


        loginStatus.innerHTML =
            "[CHECK] Verificando credenciais...";


        const formData =
            new FormData(loginForm);


        try {

            const response =
                await fetch(
                    window.location.href,
                    {
                        method: "POST",
                        body: formData,
                        redirect: "follow"
                    }
                );


            /*
             * Login realizado.
             * O Flask redirecionou para outra página.
             */

            if (
                response.redirected &&
                response.url !== window.location.href
            ) {

                loginStatus.innerHTML =
                    "[OK] Login realizado com sucesso.";


                window.location.href =
                    response.url;

                return;

            }


            /*
             * Login recusado.
             */

            loginStatus.innerHTML =
                "[ERROR] Usuário ou senha inválidos.";


            document.getElementById(
                "password"
            ).value = "";


            document.getElementById(
                "password"
            ).focus();


        }

        catch {

            loginStatus.innerHTML =
                "[ERROR] Não foi possível conectar ao servidor.";

        }


        loginButton.disabled =
            false;


        loginButton.textContent =
            "Entrar";

    }
);


/* =========================================================
   SERVER STATUS
========================================================= */

async function checkServer() {

    const status =
        document.getElementById(
            "server-status"
        );

    const connection =
        document.getElementById(
            "connection-status"
        );


    try {

        const response =
            await fetch("/status");


        const data =
            await response.json();


        status.innerHTML =
            `[OK] ${data.server} online`;


        connection.innerHTML =
            "[CONNECTED] Servidor disponível";


    }

    catch {

        status.innerHTML =
            "[OFFLINE] Servidor desconectado";


        connection.innerHTML =
            "[ERROR] Não foi possível conectar ao servidor";

    }

}


checkServer();


setInterval(
    checkServer,
    5000
);


</script>


</body>

</html>
