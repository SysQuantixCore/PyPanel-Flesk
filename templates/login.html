<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>pypanelflask/login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: radial-gradient(circle at top, #1f2a37, #0f172a);
    color: #fff;
}

.project-icon {
    display: inline-block;
    margin: 40px auto 0;
    padding: 4px 16px;

    text-align: center;
    font-size: 30px;
    color: #fff;

    background: linear-gradient(90deg,
        #3a6ea5,
        #0a246a,
        #3a6ea5,
        #0a246a,
        #3a6ea5
    );

    background-size: 300% 100%;
    animation: gradientMove 6s linear infinite;

    border-radius: 999px;
    position: relative;
}

@keyframes gradientMove {
    0% {
        background-position: 0% 50%;
    }
    100% {
        background-position: 100% 50%;
    }
}

.main {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
}

.window {
    width: 350px;
    border: 1px solid #888;
    background: #f0f0f0;
    border-radius: 6px;
    overflow: hidden;
}

.title-bar {
    background: linear-gradient(to right, #0a246a, #3a6ea5);
    color: #fff;
    padding: 8px 12px;
    font-size: 14px;
    font-weight: 500;
}

.content {
    padding: 25px 20px;
}

input {
    width: 100%;
    padding: 8px;
    margin-bottom: 15px;

    border: 1px solid #aaa;
    border-radius: 4px;
    background: #fff;
    font-size: 13px;
    transition: 0.2s;
}

input:focus {
    outline: none;
    border-color: #3a6ea5;
    box-shadow: 0 0 4px rgba(58,110,165,0.5);
}

/* Container do botão */
.button-area {
    display: flex;
    justify-content: flex-end;
}

button {
    padding: 6px 18px;
    font-size: 13px;

    border: 1px solid #888;
    border-radius: 4px;
    background: linear-gradient(#f5f5f5, #dcdcdc);

    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: linear-gradient(#ffffff, #d0d0d0);
}

button:active {
    background: #c8c8c8;
}

.footer {
    background: rgba(0,0,0,0.4);
    border-top: 1px solid rgba(255,255,255,0.05);
    padding: 15px;
    text-align: center;
    font-size: 13px;
    color: #aaa;
}

.footer strong {
    color: #fff;
}
</style>
</head>

<body>

<div style="text-align:center;">
    <div class="project-icon">PyPanel-Flask</div>
</div>

<div class="main">
    <div class="window">
        
        <div class="title-bar">
            Login
        </div>

        <div class="content">
            <form method="POST">
                <input type="text" name="username" placeholder="Usuário" required>
                <input type="password" name="password" placeholder="Senha" required>

                <div class="button-area">
                    <button type="submit">Entrar</button>
                </div>
            </form>
        </div>

    </div>
</div>

<div class="footer">
    <p><strong>PyPanel Flask</strong> • v1.0</p>
</div>

</body>
</html>
